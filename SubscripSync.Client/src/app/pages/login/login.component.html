<div class="auth-page">
    <!-- Background Effects -->
    <div class="auth-bg">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>

    <!-- Login Card -->
    <div class="auth-card animate-scale-in">
        <!-- Header -->
        <div class="auth-header">
            <div class="auth-logo">
                <mat-icon>sync</mat-icon>
            </div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to SubscripSync</p>
        </div>

        <!-- Form -->
        <form [formGroup]="loginForm" (ngSubmit)="login()" class="auth-form">
            <mat-form-field class="w-full" appearance="outline" floatLabel="always">
                <mat-label>Email Address</mat-label>
                <input matInput type="email" formControlName="email" placeholder="you@example.com">
                <mat-icon matSuffix class="field-icon">email</mat-icon>
                <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Invalid email address</mat-error>
                <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
            </mat-form-field>

            <mat-form-field class="w-full" appearance="outline" floatLabel="always">
                <mat-label>Password</mat-label>
                <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
                    placeholder="••••••••">
                <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button"
                    class="field-icon-btn">
                    <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
                <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
            </mat-form-field>

            <button mat-flat-button color="primary" type="submit" class="auth-submit"
                [disabled]="loginForm.invalid || isLoading">
                <span *ngIf="!isLoading">Sign In</span>
                <span *ngIf="isLoading" class="loading-text">
                    <mat-icon class="spin">sync</mat-icon> Signing in...
                </span>
            </button>
        </form>

        <!-- Footer -->
        <div class="auth-footer">
            <span>Don't have an account?</span>
            <a routerLink="/register" class="auth-link">Create Account</a>
        </div>
    </div>
</div>
