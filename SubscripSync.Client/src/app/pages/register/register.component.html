<div class="auth-page">
    <!-- Background Effects -->
    <div class="auth-bg">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>

    <!-- Register Card -->
    <div class="auth-card animate-scale-in">
        <!-- Header -->
        <div class="auth-header">
            <div class="auth-logo">
                <mat-icon>person_add</mat-icon>
            </div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join SubscripSync Today</p>
        </div>

        <!-- Form -->
        <form [formGroup]="registerForm" (ngSubmit)="register()" class="auth-form">
            <div class="name-row">
                <mat-form-field class="w-full" appearance="outline" floatLabel="always">
                    <mat-label>First Name</mat-label>
                    <input matInput formControlName="firstName" placeholder="John">
                    <mat-error *ngIf="registerForm.get('firstName')?.invalid">Required</mat-error>
                </mat-form-field>
                <mat-form-field class="w-full" appearance="outline" floatLabel="always">
                    <mat-label>Last Name</mat-label>
                    <input matInput formControlName="lastName" placeholder="Doe">
                    <mat-error *ngIf="registerForm.get('lastName')?.invalid">Required</mat-error>
                </mat-form-field>
            </div>

            <mat-form-field class="w-full" appearance="outline" floatLabel="always">
                <mat-label>Email Address</mat-label>
                <input matInput type="email" formControlName="email" placeholder="you@example.com">
                <mat-icon matSuffix class="field-icon">email</mat-icon>
                <mat-error *ngIf="registerForm.get('email')?.hasError('email')">Invalid email</mat-error>
                <mat-error *ngIf="registerForm.get('email')?.hasError('required')">Email is required</mat-error>
            </mat-form-field>

            <mat-form-field class="w-full" appearance="outline" floatLabel="always">
                <mat-label>Password</mat-label>
                <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
                    placeholder="••••••••">
                <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button"
                    class="field-icon-btn">
                    <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
                <mat-error *ngIf="registerForm.get('password')?.hasError('required')">Password is required</mat-error>
                <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">At least 6 characters</mat-error>
            </mat-form-field>

            <button mat-flat-button color="primary" type="submit" class="auth-submit"
                [disabled]="registerForm.invalid || isLoading">
                <span *ngIf="!isLoading">Sign Up</span>
                <span *ngIf="isLoading" class="loading-text">
                    <mat-icon class="spin">sync</mat-icon> Creating Account...
                </span>
            </button>
        </form>

        <!-- Footer -->
        <div class="auth-footer">
            <span>Already have an account?</span>
            <a routerLink="/login" class="auth-link">Log In</a>
        </div>
    </div>
</div>
