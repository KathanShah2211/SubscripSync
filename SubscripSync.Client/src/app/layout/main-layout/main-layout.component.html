<mat-toolbar color="primary" class="shadow-md z-10 relative">
    <span>SubscripSync</span>
    <span class="flex-auto"></span>
    <button mat-button routerLink="/dashboard">Dashboard</button>
    <button mat-button routerLink="/analytics">Analytics</button>

    <button mat-icon-button [matMenuTriggerFor]="notificationMenu" class="mr-2">
        <mat-icon [matBadge]="unreadCount" matBadgeColor="warn" [matBadgeHidden]="unreadCount === 0">notifications</mat-icon>
    </button>
    <mat-menu #notificationMenu="matMenu" class="max-w-md bg-white">
        <div class="p-4 w-80" (click)="$event.stopPropagation()">
            <h3 class="text-lg font-bold mb-3 border-b pb-2 text-gray-800">Notifications</h3>
            <div *ngIf="notifications.length === 0" class="text-gray-500 text-sm">No new notifications.</div>
            <div class="max-h-64 overflow-y-auto">
                <div *ngFor="let notif of notifications" class="mb-2 p-3 border rounded-lg cursor-pointer transition-colors hover:bg-gray-50" [ngClass]="{'bg-blue-50 border-blue-200': !notif.isRead, 'bg-white border-gray-200': notif.isRead}" (click)="markAsRead(notif)">
                    <div class="font-semibold text-gray-800" [ngClass]="{'font-bold': !notif.isRead}">{{notif.title}}</div>
                    <div class="text-xs text-gray-600 mt-1">{{notif.message}}</div>
                    <div class="text-[10px] text-gray-400 mt-1">{{notif.createdAt | date:'short'}}</div>
                </div>
            </div>
        </div>
    </mat-menu>

    <button mat-button (click)="openProfile()">Profile</button>
    <button mat-button color="warn" (click)="logout()">Logout</button>
</mat-toolbar>

<div class="container mx-auto p-6">
    <router-outlet></router-outlet>
</div>
