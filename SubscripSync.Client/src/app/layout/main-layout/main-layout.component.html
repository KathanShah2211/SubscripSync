<nav class="navbar glass-nav">
    <div class="nav-container">
        <!-- Brand -->
        <a routerLink="/dashboard" class="brand">
            <div class="brand-icon">
                <mat-icon>sync</mat-icon>
            </div>
            <span class="brand-text">Subscrip<span class="brand-accent">Sync</span></span>
        </a>

        <!-- Nav Links -->
        <div class="nav-links">
            <a routerLink="/dashboard" routerLinkActive="nav-active" class="nav-link">
                <mat-icon>dashboard</mat-icon>
                <span>Dashboard</span>
            </a>
            <a routerLink="/analytics" routerLinkActive="nav-active" class="nav-link">
                <mat-icon>insights</mat-icon>
                <span>Analytics</span>
            </a>
        </div>

        <!-- Right Actions -->
        <div class="nav-actions">
            <!-- Notifications -->
            <button mat-icon-button [matMenuTriggerFor]="notificationMenu" class="action-btn">
                <mat-icon [matBadge]="unreadCount" matBadgeColor="warn" [matBadgeHidden]="unreadCount === 0"
                    matBadgeSize="small">notifications</mat-icon>
            </button>
            <mat-menu #notificationMenu="matMenu" class="notification-panel">
                <div class="notif-container" (click)="$event.stopPropagation()">
                    <div class="notif-header">
                        <h3>Notifications</h3>
                        <span class="notif-count" *ngIf="unreadCount > 0">{{unreadCount}} new</span>
                    </div>
                    <div *ngIf="notifications.length === 0" class="notif-empty">
                        <mat-icon class="notif-empty-icon">notifications_none</mat-icon>
                        <p>No notifications yet</p>
                    </div>
                    <div class="notif-list">
                        <div *ngFor="let notif of notifications" class="notif-item"
                            [class.notif-unread]="!notif.isRead" (click)="markAsRead(notif)">
                            <div class="notif-dot" *ngIf="!notif.isRead"></div>
                            <div class="notif-content">
                                <div class="notif-title">{{notif.title}}</div>
                                <div class="notif-message">{{notif.message}}</div>
                                <div class="notif-time">{{notif.createdAt | date:'short'}}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </mat-menu>

            <!-- Profile -->
            <a routerLink="/profile" routerLinkActive="nav-active" class="profile-link">
                <div class="avatar">
                    <mat-icon>person</mat-icon>
                </div>
            </a>

            <!-- Logout -->
            <button class="logout-btn" (click)="logout()">
                <mat-icon>logout</mat-icon>
            </button>
        </div>
    </div>
</nav>

<main class="main-content">
    <router-outlet></router-outlet>
</main>
